# Deploys a v* tag on main: runs the suite in the flake's shell, then
# deploy/deploy.sh, as `just deploy` does. The key and host are secrets of the
# production environment, which only v* tags may deploy to.
name: Deploy

on:
  push:
    tags: ["v*"]

# One deploy at a time; a tag pushed meanwhile waits rather than cancelling it.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME is not on main; not deploying." >&2
            exit 1
          fi
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: nix develop --command cargo test --workspace

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ./deploy/deploy.sh
