# Runs the checks and tests on every pull request, in the flake's dev shell,
# so a change from any machine or session is checked the same way, and
# auto-fix has a failure to fix.
name: Check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - run: nix develop --command just check
      - run: nix develop --command just test
