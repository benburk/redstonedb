# Runs the checks and tests on every pull request, in the flake's dev shell,
# so a change from any machine or session is checked the same way, and
# auto-fix has a failure to fix. Runs on main too, only to save the build
# cache: a pull request can restore main's cache but not another pull
# request's, so without it every pull request built from cold.
name: Check

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels its run still in progress.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# Check and test compile separately, clippy's build being no use to the
# tests', so they run side by side, each with its own cache.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: nix develop --command just check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: nix develop --command just test
