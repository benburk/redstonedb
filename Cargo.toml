[package]
name = "redstone-database"
version = "0.1.0"
edition = "2024"

# The library keeps a fixed crate name so the binary, the tests, and the
# tracing filter never have to spell out the project's name.
[lib]
name = "app"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.4", features = ["multipart"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
fastnbt = "2.6.3"
flate2 = "1.1.10"
form_urlencoded = "1.2.2"
maud = { version = "0.27.0", features = ["axum"] }
# MCHPRS's redstone compiler, for simulating builds; not on crates.io.
mchprs_blocks = { git = "https://github.com/MCHPR/MCHPRS", rev = "d492e433f2c7de5fd5c71f165cb60f0d912ebf04" }
mchprs_redpiler = { git = "https://github.com/MCHPR/MCHPRS", rev = "d492e433f2c7de5fd5c71f165cb60f0d912ebf04" }
mchprs_redstone = { git = "https://github.com/MCHPR/MCHPRS", rev = "d492e433f2c7de5fd5c71f165cb60f0d912ebf04" }
mchprs_world = { git = "https://github.com/MCHPR/MCHPRS", rev = "d492e433f2c7de5fd5c71f165cb60f0d912ebf04", features = ["testing"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid"] }
time = "0.3.41"
tiny-skia = "0.12"
tokio = { version = "1.47.1", features = ["full"] }
tower-http = { version = "0.6.6", features = ["set-header", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["json", "env-filter"] }
uuid = { version = "1.17.0", features = ["v4"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Noisy pedantic lints not worth enforcing in an application.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Tests run the simulator, which unoptimized is many times slower: the
# crate is built lightly optimized, keeping its rebuilds quick, and its
# dependencies, built once, fully.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
